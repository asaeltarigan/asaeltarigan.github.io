<script>
  /* Responsive nav controller: flex overflow handling + dropdown anchored under the burger. Watches the lists so the theme's greedy-nav cannot override it. NOTE: only block comments here - the site build collapses inline-script whitespace and line comments would swallow the rest of the script. */
  (function () {
    var nav = document.querySelector("#site-nav");
    if (!nav) return;
    var ul = nav.querySelector(".visible-links");
    var hidden = nav.querySelector(".hidden-links");
    var btn = nav.querySelector("button");
    if (!ul || !hidden || !btn) return;
    function isPersist(li) { return li.classList.contains("persist"); }
    var lastState = "";
    function update() {
      /* bring all hidden items back to their slot (before the controls cluster) */
      while (hidden.firstChild) {
        var anchor = ul.querySelector(".burger-cell") || ul.querySelector(".persist.tail") || null;
        if (anchor) ul.insertBefore(hidden.firstChild, anchor);
        else ul.appendChild(hidden.firstChild);
      }
      /* hide rightmost non-persist items until content fits the nav */
      var brandLi = ul.querySelector(".masthead__menu-item--lg");
      if (brandLi) brandLi.style.flexShrink = "0"; /* measure with brand at full width */
      var avail = nav.clientWidth;
      var guard = 0;
      while (ul.scrollWidth > avail && guard++ < 60) {
        var lis = Array.prototype.slice.call(ul.children).filter(function (li) { return !isPersist(li); });
        if (!lis.length) break;
        hidden.insertBefore(lis[lis.length - 1], hidden.firstChild);
      }
      if (brandLi) brandLi.style.flexShrink = ""; /* allow truncation only as last resort */
      /* show the burger only when something is tucked away */
      btn.classList.toggle("hidden", hidden.children.length === 0);
      /* keep the dropdown aligned under the burger while open */
      if (!hidden.classList.contains("hidden")) {
        var n = nav.getBoundingClientRect();
        var b = btn.getBoundingClientRect();
        hidden.style.right = Math.round(n.right - b.right) + "px";
        hidden.style.left = "auto";
      }
      var state = hidden.children.length + "|" + btn.classList.contains("hidden");
      var stable = (state === lastState);
      lastState = state;
      return stable;
    }
    var t;
    function schedule() { clearTimeout(t); t = setTimeout(function () { update(); }, 80); }
    window.addEventListener("resize", schedule);
    /* the theme's greedy-nav also moves items on load/resize; react to any change */
    var mo = new MutationObserver(schedule);
    mo.observe(hidden, { childList: true });
    mo.observe(ul, { childList: true });
    btn.addEventListener("click", function () { setTimeout(update, 0); });
    window.addEventListener("load", function () { setTimeout(update, 200); });
    /* poll until two consecutive runs agree (the theme may act late) */
    var attempts = 0;
    (function loop() {
      var stable = update();
      if (++attempts < 24 && !stable) setTimeout(loop, 300);
    })();
  })();
</script>
<script>
  /* Sidebar scroll-down hint: small arrow when the sidebar can scroll further */
  (function () {
    var s = document.querySelector(".sidebar");
    if (!s) return;
    var hint = document.createElement("div");
    hint.className = "sidebar-scroll-hint";
    hint.setAttribute("aria-hidden", "true");
    hint.textContent = "\u25BE";
    s.appendChild(hint);
    function upd() {
      var can = s.scrollHeight > s.clientHeight + 4 &&
                s.scrollTop + s.clientHeight < s.scrollHeight - 8;
      hint.style.display = can ? "flex" : "none";
    }
    upd();
    s.addEventListener("scroll", upd);
    window.addEventListener("resize", upd);
    setInterval(upd, 2000);
  })();
</script>
