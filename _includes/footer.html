<script>
  /* Dropdown (burger) menu: open aligned under the burger, not at the nav's right edge */
  (function () {
    var nav = document.querySelector("#site-nav");
    var btn = nav ? nav.querySelector("button") : null;
    var hl = nav ? nav.querySelector(".hidden-links") : null;
    if (!nav || !btn || !hl) return;
    function place() {
      if (hl.classList.contains("hidden")) return;
      var n = nav.getBoundingClientRect();
      var b = btn.getBoundingClientRect();
      hl.style.right = Math.round(n.right - b.right) + "px";
      hl.style.left = "auto";
    }
    btn.addEventListener("click", function () { setTimeout(place, 0); });
    window.addEventListener("resize", place);
    document.addEventListener("keydown", function (e) { if (e.key === "Escape") place(); });
  })();
</script>
<script>
  /* Sidebar scroll-down hint: small arrow when the sidebar can scroll further */
  (function () {
    var s = document.querySelector(".sidebar");
    if (!s) return;
    var hint = document.createElement("div");
    hint.className = "sidebar-scroll-hint";
    hint.setAttribute("aria-hidden", "true");
    hint.textContent = "\u25BE";
    s.appendChild(hint);
    function upd() {
      var can = s.scrollHeight > s.clientHeight + 4 &&
                s.scrollTop + s.clientHeight < s.scrollHeight - 8;
      hint.style.display = can ? "flex" : "none";
    }
    upd();
    s.addEventListener("scroll", upd);
    window.addEventListener("resize", upd);
    setInterval(upd, 2000);
  })();
</script>
