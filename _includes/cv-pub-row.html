{% include base_path %}
{% assign post = include.post %}
<div class="cv-pub">
  <span class="cv-pub__year">{{ post.date | date: "%Y" }}</span>
  <div class="cv-pub__main">
    <a class="cv-pub__title" href="{{ base_path }}{{ post.url }}">{{ post.title }}</a>
    {% if post.venue %}<div class="cv-pub__venue">{{ post.venue }}</div>{% endif %}
  </div>
  {% if post.status %}<span class="cv-badge">{{ post.status }}</span>{% endif %}
</div>
